<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav id="mainNavigation"></nav>

    <main>

        <h1>Student Management</h1>

        <!-- Add Student Section -->
        <section>

            <h2>Add Student</h2>

            <form id="studentForm">

                <div>
                    <label for="studentId">Student ID</label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Student ID"
                        required
                    >
                </div>

                <div>
                    <label for="studentName">Student Name</label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Student Name"
                        required
                    >
                </div>

                <div>
                    <label for="studentCourse">Course</label>

                    <input
                        type="text"
                        id="studentCourse"
                        placeholder="Course"
                        required
                    >
                </div>

                <div>
                    <label for="studentYear">Year</label>

                    <input
                        type="number"
                        id="studentYear"
                        placeholder="Year"
                        min="1"
                        max="4"
                        required
                    >
                </div>

                <button type="submit">
                    Add Student
                </button>

            </form>

        </section>


        <!-- Student List Section -->
        <section>

            <h2>Student List</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>Semester</th>
                        <th>Email</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">
                </tbody>

            </table>

        </section>

    </main>

    <script src="js/app.js"></script>
    <script src="js/studentData.js"></script>
    <script src="js/students.js"></script>

</body>

</html>
